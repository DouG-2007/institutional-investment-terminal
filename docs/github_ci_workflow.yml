name: Institutional Investment Terminal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (app.py, core/*.py, tests/*.py)
        run: python -m py_compile app.py core/*.py tests/*.py

      - name: Run automated invariants & AI lockdown tests (Zero-Key mode)
        env:
          GEMINI_API_KEY: ""
        run: python -m unittest discover -s tests -v
